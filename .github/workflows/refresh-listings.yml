name: Refresh property listings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      IMMOBILIARE_CLIENT_ID: ${{ secrets.IMMOBILIARE_CLIENT_ID }}
      IMMOBILIARE_CLIENT_SECRET: ${{ secrets.IMMOBILIARE_CLIENT_SECRET }}
      IMMOBILIARE_USERNAME: ${{ secrets.IMMOBILIARE_USERNAME }}
      IMMOBILIARE_PASSWORD: ${{ secrets.IMMOBILIARE_PASSWORD }}
      IMMOBILIARE_BASE_URL: ${{ vars.IMMOBILIARE_BASE_URL }}
      IMMOBILIARE_PAGE_SIZE: '50'
      IMMOBILIARE_MAX_PAGES: '10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh listings
        run: node scripts/refresh-listings.mjs
      - name: Commit data changes
        run: |
          if git diff --quiet -- public/data/listings.json; then
            echo "No listing changes"
            exit 0
          fi
          git config user.name "homeholiday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/listings.json
          git commit -m "chore: refresh property listings"
          git push
